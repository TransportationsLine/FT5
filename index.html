<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Football 5v5 Realistic</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;position:fixed;background:#0d1b2a;color:#fff;font-family:'Segoe UI',Arial,sans-serif;touch-action:none;user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:env(safe-area-inset-top);left:0;right:0;display:flex;justify-content:center;gap:12px;padding:6px;font-weight:bold;font-size:clamp(14px,2.2vw,22px);pointer-events:none;direction:ltr}
#hud span{background:rgba(0,0,0,.45);padding:2px 14px;border-radius:8px}
#sr{color:#ff5a5f}#sg{color:#00d97e}#tm{color:#ffd93d;min-width:70px;text-align:center}
#sbw{position:fixed;top:calc(env(safe-area-inset-top) + 42px);left:50%;width:120px;height:5px;margin-left:-60px;background:rgba(0,0,0,.5);border-radius:3px;overflow:hidden;pointer-events:none}
#sb{height:100%;width:100%;background:#4ecca3}
#msg{position:fixed;top:calc(env(safe-area-inset-top) + 56px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:clamp(18px,4vw,30px);font-weight:bold;background:rgba(0,0,0,.55);padding:4px 16px;border-radius:12px;text-align:center;pointer-events:none;white-space:nowrap}
#msg small{font-size:clamp(11px,2vw,15px);opacity:.85}
#msg.big{top:50%;transform:translate(-50%,-50%);font-size:clamp(44px,13vw,120px);background:rgba(0,0,0,.35);padding:10px 36px;border-radius:24px;animation:pop .5s ease-out}
#msg.big small{font-size:clamp(16px,4vw,32px)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.3);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
#sup{position:fixed;top:calc(env(safe-area-inset-top) + 36px);left:calc(50% + 70px);font-size:13px;font-weight:bold;pointer-events:none;color:#ffd93d;direction:ltr;background:rgba(0,0,0,.45);padding:1px 8px;border-radius:8px;display:none}
#ctl{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;direction:ltr;flex-direction:row-reverse}
#pad{position:relative;width:clamp(190px,42vh,280px);aspect-ratio:1;pointer-events:none}
#pad .b{position:absolute;pointer-events:auto;width:34%;height:34%;border-radius:50%;border:2.5px solid currentColor;background:rgba(0,0,0,.45);font-family:inherit;font-weight:bold;font-size:clamp(10px,1.6vh,13px);overflow:hidden;touch-action:none;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;transform:translate(-50%,-50%)}
#pad .b.on{background:rgba(255,255,255,.35);transform:translate(-50%,-50%) scale(.92)}
#pad .b i{position:absolute;left:0;bottom:0;height:100%;width:0;background:rgba(255,217,61,.5);pointer-events:none}
#pad .b span{position:relative;line-height:1.1}
#bchase{left:50%;top:50%}
#bsl{left:50%;top:17%}
#bsw{left:50%;top:83%}
#bpass{left:17%;top:50%}
#bshoot{left:83%;top:50%}
#joy{width:clamp(110px,26vh,170px);aspect-ratio:1;position:relative;pointer-events:auto;touch-action:none;color:#e63946;flex-shrink:0}
.jb{position:absolute;inset:0;border-radius:50%;border:3px solid currentColor;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.2),rgba(0,0,0,.5))}
.kn{position:absolute;width:40%;height:40%;top:30%;left:30%;border-radius:50%;background:currentColor;pointer-events:none}
#tm small{display:block;font-size:.55em;opacity:.8;line-height:1.1}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(13,27,42,.9);z-index:5;padding:16px}
#menu h1{font-size:clamp(26px,6vw,48px);margin-bottom:10px;text-align:center}
#menu button{width:min(88vw,320px);padding:14px;border-radius:14px;border:2px solid #ffd93d;background:rgba(255,255,255,.08);color:#fff;font-family:inherit;font-weight:bold;font-size:clamp(15px,3vw,20px);cursor:pointer}
#menu small{opacity:.75;text-align:center;max-width:90vw}
#menu #camrow .chip{width:auto;padding:7px 12px;border-radius:10px;border:2px solid #456;font-size:14px}
#menu #camrow .chip.sel{border-color:#ffd93d;background:#2a3f1d}
#who{font-size:clamp(14px,2.6vw,18px);opacity:.9;min-height:1.3em;text-align:center}
.ibtn{position:fixed;top:calc(env(safe-area-inset-top) + 6px);left:10px;width:44px;height:44px;border-radius:50%;border:2px solid #ffd93d;background:rgba(0,0,0,.5);font-size:22px;color:#fff;z-index:3;cursor:pointer;display:none}
#camdd{position:fixed;top:calc(env(safe-area-inset-top) + 56px);left:110px;z-index:4;display:none;flex-direction:column;gap:4px;background:rgba(13,27,42,.92);border:2px solid #ffd93d;border-radius:12px;padding:6px}
#camdd .chip{text-align:center;min-width:70px;font-size:13px}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);z-index:8;padding:8px}
.card{width:min(96vw,440px);max-height:90vh;overflow:auto;touch-action:pan-y;background:#13263c;border:2px solid #ffd93d;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.card h2{font-size:18px}.card h3{font-size:13px;color:#ffd93d;margin-top:6px}.card label{font-size:12px;opacity:.85;margin-top:4px}
.card input{flex:1;min-width:0;padding:8px;border-radius:8px;border:1px solid #456;background:#0d1b2a;color:#fff;font-family:inherit;font-size:14px;user-select:text}
.row{display:flex;gap:6px;flex-wrap:wrap}.hint{font-size:11px;opacity:.75}
.mbtn{padding:9px 12px;border-radius:10px;border:2px solid #ffd93d;background:rgba(255,255,255,.08);color:#fff;font-family:inherit;font-weight:bold;cursor:pointer;font-size:13px}
.chip{padding:7px 10px;border-radius:10px;border:2px solid #456;background:#0d1b2a;color:#fff;font-family:inherit;font-weight:bold;cursor:pointer;font-size:12px}
.chip.sel{border-color:#ffd93d;background:#2a3f1d}
#accmsg{min-height:18px;font-size:12px;color:#7fffd4}#accinfo{font-size:13px;line-height:1.6}
.card.wide{width:min(97vw,560px)}
.tm{display:flex;gap:6px;direction:ltr;align-items:flex-start;flex-wrap:nowrap}
.tcol{width:64px;display:flex;flex-direction:column;gap:5px;direction:rtl;flex-shrink:0}.tcol h3{text-align:center;margin:0;font-size:12px}
.vl{display:flex;flex-direction:column;gap:5px}.vl .chip{min-width:0;width:100%}
.mp{position:relative;flex:1;min-width:100px;max-height:60vh;aspect-ratio:3/4;background:repeating-linear-gradient(0deg,#2e7d32 0 12%,#2a7430 12% 24%);border:2px solid rgba(255,255,255,.8);border-radius:6px}
.pd{position:absolute;z-index:2;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:#e63946;border:2px solid #fff;color:#fff;font-family:inherit;font-weight:bold;font-size:10px;cursor:pointer;padding:0}
.pd.gk{background:#ffb703;color:#222;cursor:default}.pd.sel{border-color:#ffd93d;box-shadow:0 0 0 3px rgba(255,217,61,.6)}
.panel{display:none;flex-direction:column;gap:6px}
.st{background:#0d1b2a;border-radius:10px;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px;text-align:center}
.st h3{grid-column:1/-1;margin:0;font-size:13px}.st b{display:block;font-size:24px}.st span{font-size:11px;opacity:.75}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud"><span id="sr">0</span><span id="tm">02:00</span><span id="sg">0</span></div>
<div id="sbw"><div id="sb"></div></div>
<div id="msg"></div><div id="sup"></div>
<button class="ibtn" id="bteam">👕</button><button class="ibtn" id="bstat" style="left:60px">📊</button><button class="ibtn" id="bcam" style="left:110px">📷</button>
<div id="camdd">
  <button class="chip" data-c="1">1 · قريب</button><button class="chip" data-c="2">2</button><button class="chip" data-c="3">3</button><button class="chip" data-c="4">4 · بعيد</button><button class="chip" data-c="5">5 · من الأعلى</button>
</div>
<div id="menu"><h1>⚽ كرة القدم 5 ضد 5</h1>
  <div id="who"></div>
  <div class="row" id="camrow" style="width:min(88vw,320px);justify-content:center;align-items:center;gap:6px">
    <span style="font-size:13px">📷 الكاميرا</span>
    <button class="chip" data-c="1">1</button><button class="chip" data-c="2">2</button><button class="chip" data-c="3">3</button><button class="chip" data-c="4">4</button><button class="chip" data-c="5">5</button>
  </div>
  <button id="mcpu">🤖 مباراة ودية ضد الكمبيوتر</button>
  <button id="monl">🌐 مباراة رسمية أونلاين</button>
  <div class="row" style="width:min(88vw,320px);gap:8px"><button class="mbtn" id="mteam" style="flex:1">👕 الفريق</button><button class="mbtn" id="mstat" style="flex:1">📊 الإحصائيات</button><button class="mbtn" id="macc" style="flex:1">👤 الحساب</button></div>
  <small>تمرير/تسديد من الأزرار · الركض يلاحق الكرة · مقصية للكرات العالية خلفك · المس الملعب لرفع الكرة لزميل · الحلقة الزرقاء تُظهر هدف التمريرة</small></div>
<div class="modal" id="team"><div class="card wide">
  <h2>👕 فريقك</h2>
  <div class="tm">
    <div class="tcol"><h3>الخطة</h3><div class="vl" id="forms"></div></div>
    <div class="mp" id="mp"></div>
    <div class="tcol"><h3>الاحتياط</h3><div class="vl" id="bench"></div></div>
  </div>
  <div class="hint">اضغط لاعباً ثم لاعباً آخر لتبديلهما</div>
  <button class="mbtn" id="tclose">تم</button></div></div>
<div class="modal" id="acc"><div class="card">
  <h2>👤 الحساب</h2><div id="accinfo"></div>
  <label>اسم اللاعب</label><div class="row"><input id="inName" maxlength="20"><button class="mbtn" id="bName">حفظ</button></div>
  <div class="row"><button class="mbtn" id="tReg" style="flex:1">📧 تسجيل</button><button class="mbtn" id="tRec" style="flex:1">🔑 استرجاع</button></div>
  <div class="panel" id="pReg"><label>بريدك</label>
    <div class="row"><input id="inMail" type="email" dir="ltr" placeholder="name@example.com"><button class="mbtn" id="bMail">إرسال</button></div></div>
  <div class="panel" id="pRec"><label>بريد الحساب</label>
    <div class="row"><input id="rcMail" type="email" dir="ltr" placeholder="بريد الحساب"><button class="mbtn" id="bReq">أرسل</button></div>
    <label>كود الاسترجاع</label>
    <div class="row"><input id="rcCode" dir="ltr" placeholder="كود الاسترجاع"><button class="mbtn" id="bRec">استرجاع</button></div></div>
  <div id="accmsg"></div><button class="mbtn" id="aclose">إغلاق</button></div></div>
<div class="modal" id="stats"><div class="card"><h2>📊 إحصائيات الفريق</h2><div id="statbody"></div><button class="mbtn" id="sclose">إغلاق</button></div></div>
<div id="ctl">
  <div id="pad">
    <button class="b" id="bsl" style="color:#ff6b6b"><span>زحلقة</span></button>
    <button class="b" id="bpass" style="color:#ffd93d"><i id="fill"></i><span>تمرير</span></button>
    <button class="b" id="bshoot" style="color:#ff8c00"><i id="fill2"></i><span>تسديد</span></button>
    <button class="b" id="bsw" style="color:#b388ff"><span>تبديل</span></button>
    <button class="b" id="bchase" style="color:#00d9ff"><span>ركض<br>ومطاردة</span></button>
  </div>
  <div id="joy"><div class="jb"></div><div class="kn"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ================== ثوابت ================== */
const W=1000,H=640,GH=200,GD=24,M=20,PR=12;
const S=.1,BR=8;
const HALF=120;

/* فيزياء واقعية - سرعات ممتعة مثل FIFA */
const BALL_FRICTION=.972;
const BALL_AIR_DRAG=.998;
const BALL_GRAVITY=.34;
const BALL_RESTITUTION=.6;
const PLAYER_MAX_SPEED=2.0;
const PLAYER_SPRINT_SPEED=3.2;
const PLAYER_ACCEL=.28;
const PLAYER_FRICTION=.86;
const KICK_RANGE=32;
const DRIBBLE_DIST=PR+BR+2;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b,c,d)=>Math.hypot(c-a,d-b);
const len=Math.hypot;
const norm=(x,y)=>{const l=Math.hypot(x,y)||1;return{x:x/l,y:y/l}};
const $=id=>document.getElementById(id);

/* ================== الصوت ================== */
const actx=new(window.AudioContext||window.webkitAudioContext)();
let au=false,crowdGain=null;
const unlock=()=>{if(!au){actx.resume();au=true;startCrowd()}};
addEventListener('pointerdown',unlock,{once:true});
addEventListener('keydown',unlock,{once:true});
function startCrowd(){
  try{
    const n=actx.sampleRate*2,b=actx.createBuffer(1,n,actx.sampleRate),d=b.getChannelData(0);
    let l=0;
    for(let i=0;i<n;i++){const w=Math.random()*2-1;l=(l+.02*w)/1.02;d[i]=l*3.5}
    const s=actx.createBufferSource();s.buffer=b;s.loop=true;
    const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=900;
    crowdGain=actx.createGain();crowdGain.gain.value=.05;
    s.connect(f);f.connect(crowdGain);crowdGain.connect(actx.destination);s.start();
  }catch(_){}
}
function crowdSwell(v,d){
  if(!crowdGain)return;
  const t=actx.currentTime,g=crowdGain.gain;
  g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);
  g.linearRampToValueAtTime(v,t+.4);
  g.linearRampToValueAtTime(.05,t+d);
}
function beep(f,d=.08,ty='sine',v=.2,to=null){
  if(!au)return;
  const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
  o.type=ty;o.frequency.setValueAtTime(f,t);
  if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d);
}
const sfx={
  kick:p=>beep(300+p*400,.09,'square',.28,70),
  touch:()=>beep(600,.04,'triangle',.15),
  goal:()=>{beep(523,.1);setTimeout(()=>beep(659,.1),100);setTimeout(()=>beep(784,.25),200);crowdSwell(.2,3.5)},
  count:()=>beep(600,.12),
  go:()=>beep(900,.3,'sine',.3,1400),
  whistle:()=>beep(1200,.5,'sine',.3,1600),
  slide:()=>beep(400,.15,'sawtooth',.2,150),
  sw:()=>beep(700,.06,'triangle',.2,1000),
  down:()=>beep(220,.15,'square',.3,60),
  post:()=>{beep(900,.14,'triangle',.3,500);crowdSwell(.12,1.5)},
  out:()=>beep(1000,.2,'sine',.18,1200),
  bicycle:()=>{beep(300,.12,'sawtooth',.3,900);setTimeout(()=>beep(500,.1,'square',.25,1200),80)},
  super:()=>{beep(200,.6,'sawtooth',.3,1400);beep(90,.7,'sine',.35,700)}
};

/* ================== Three.js ================== */
const R=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true});
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
R.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0c1a2e);
scene.fog=new THREE.Fog(0x0c1a2e,130,320);
const cam=new THREE.PerspectiveCamera(44,1,.5,500);
scene.add(new THREE.HemisphereLight(0xdfe9ff,0x3a5f3a,.85));
const sun=new THREE.DirectionalLight(0xfff4e0,.9);
sun.position.set(40,80,30);sun.castShadow=true;
Object.assign(sun.shadow.camera,{left:-75,right:75,top:55,bottom:-55});
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=10;sun.shadow.camera.far=200;
sun.shadow.bias=-0.0004;sun.shadow.radius=2;
scene.add(sun);
const fillLight=new THREE.DirectionalLight(0xffeedd,.22);
fillLight.position.set(-40,50,-30);scene.add(fillLight);
function resize(){
  R.setSize(innerWidth,innerHeight,false);
  cam.aspect=innerWidth/innerHeight;
  cam.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();

/* الملعب */
(function(){
  const c=document.createElement('canvas');c.width=2048;c.height=1024;
  const x=c.getContext('2d');x.scale(2048/W,1024/H);
  for(let i=0;i<20;i++){
    x.fillStyle=i%2?'#2e7d32':'#2a7430';
    x.fillRect(i*(W/20),0,W/20,H);
  }
  x.strokeStyle='rgba(255,255,255,.9)';x.fillStyle='rgba(255,255,255,.95)';x.lineWidth=3;
  x.strokeRect(M,M,W-2*M,H-2*M);
  x.beginPath();x.moveTo(W/2,M);x.lineTo(W/2,H-M);x.stroke();
  x.beginPath();x.arc(W/2,H/2,70,0,7);x.stroke();
  x.beginPath();x.arc(W/2,H/2,3.5,0,7);x.fill();
  x.strokeRect(M,H/2-140,100,280);x.strokeRect(W-M-100,H/2-140,100,280);
  x.strokeRect(M,H/2-80,40,160);x.strokeRect(W-M-40,H/2-80,40,160);
  x.beginPath();x.arc(W/2,H/2,4,0,7);x.fill();
  /* نقطة الجزاء + قوس منطقة الجزاء + أقواس الزوايا */
  x.beginPath();x.arc(M+70,H/2,3,0,7);x.fill();
  x.beginPath();x.arc(W-M-70,H/2,3,0,7);x.fill();
  x.beginPath();x.arc(M+70,H/2,60,-1.047,1.047);x.stroke();
  x.beginPath();x.arc(W-M-70,H/2,60,Math.PI-1.047,Math.PI+1.047);x.stroke();
  x.beginPath();x.arc(M,M,12,0,Math.PI/2);x.stroke();
  x.beginPath();x.arc(W-M,M,12,Math.PI/2,Math.PI);x.stroke();
  x.beginPath();x.arc(W-M,H-M,12,Math.PI,Math.PI*1.5);x.stroke();
  x.beginPath();x.arc(M,H-M,12,Math.PI*1.5,Math.PI*2);x.stroke();
  const t=new THREE.CanvasTexture(c);t.anisotropy=8;
  const p=new THREE.Mesh(new THREE.PlaneGeometry(W*S,H*S),new THREE.MeshLambertMaterial({map:t}));
  p.rotation.x=-Math.PI/2;p.receiveShadow=true;scene.add(p);
  const g=new THREE.Mesh(new THREE.PlaneGeometry(500,400),new THREE.MeshLambertMaterial({color:0x1f5c28}));
  g.rotation.x=-Math.PI/2;g.position.y=-.05;scene.add(g);
})();

/* الملعب المحيط: لوحات إعلانية + مدرجات + أضواء كاشفة */
(function(){
  const bc=document.createElement('canvas');bc.width=1024;bc.height=64;
  const bx=bc.getContext('2d');
  const names=['FOOTBALL','5 vs 5','GOAL!','ARENA','PRO LEAGUE','CHAMPIONS','FAIR PLAY','LEGENDS'];
  const cols=['#e63946','#1d3557','#06d6a0','#ffb703'];
  for(let i=0;i<8;i++){
    bx.fillStyle=cols[i%4];bx.fillRect(i*128,0,128,64);
    bx.fillStyle='#fff';bx.font='bold 26px Arial';bx.textAlign='center';bx.textBaseline='middle';
    bx.fillText(names[i],i*128+64,34);
  }
  const mk=rep=>{
    const t=new THREE.CanvasTexture(bc);t.wrapS=THREE.RepeatWrapping;t.repeat.set(rep,1);
    return new THREE.MeshLambertMaterial({map:t});
  };
  const hz=H/2*S+1.6,hx=W/2*S+4.2;
  const b1=new THREE.Mesh(new THREE.BoxGeometry(W*S+8,1.2,.3),mk(1.2));b1.position.set(0,.6,-hz);scene.add(b1);
  const b2=new THREE.Mesh(new THREE.BoxGeometry(W*S+8,1.2,.3),mk(1.2));b2.position.set(0,.6,hz);scene.add(b2);
  const b3=new THREE.Mesh(new THREE.BoxGeometry(.3,1.2,H*S+3.4),mk(.9));b3.position.set(-hx,.6,0);scene.add(b3);
  const b4=new THREE.Mesh(new THREE.BoxGeometry(.3,1.2,H*S+3.4),mk(.9));b4.position.set(hx,.6,0);scene.add(b4);

  const crowdTex=()=>{
    const c=document.createElement('canvas');c.width=512;c.height=128;
    const x=c.getContext('2d');x.fillStyle='#141c2b';x.fillRect(0,0,512,128);
    const pal=['#e63946','#06d6a0','#ffd93d','#f1faee','#a8dadc','#457b9d','#ff9f1c','#8d99ae'];

class Player{
  constructor(x,y,team,number,role){
    Object.assign(this,{
      x,y,vx:0,vy:0,homeX:x,homeY:y,team,number,role,
      radius:PR,isGK:role==='GK',facing:team==='red'?1:-1,
      sliding:0,slideDirX:0,slideDirY:0,slideCd:0,

      kickT:0,kickDirX:0,kickDirY:1,celeb:0,
      hasBall:false,heading:team==='red'?Math.PI/2:-Math.PI/2
    });

  }
  build(){
    const isRef=this.team==='ref',isRed=this.team==='red',gk=this.isGK;
    const shirt=gk?0xffb703:isRef?0xffd400:isRed?0xe63946:0x06d6a0;

    const hairC=HAIRS[(this.number*2+(isRed?1:0))%HAIRS.length];
    const hand=gk?0xffffff:skin;
    const r=this.mesh=new THREE.Group();
    const i=this.inner=new THREE.Group();
    r.add(i);
    const sph=(rad,seg,c,x,y,z,sx=1,sy=1,sz=1,sh)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(rad,seg,Math.max(4,seg*0.75|0)),mat(c));m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=!!sh;return m};
    
    const torso=new THREE.Mesh(new THREE.CylinderGeometry(.95,.62,1.35,12,2),mat(shirt));
    torso.scale.z=.52;torso.position.y=3.2;torso.castShadow=true;
    const shL=sph(.34,10,shirt,-.92,3.7,0,1,.85,.9,true);
    const shR=sph(.34,10,shirt,.92,3.7,0,1,.85,.9,true);
    const chest=sph(.82,12,shirt,0,3.45,.1,1,.7,.45,true);
    const pelvis=new THREE.Mesh(new THREE.CylinderGeometry(.7,.78,.7,12),mat(shorts));
    pelvis.scale.z=.55;pelvis.position.y=2.15;pelvis.castShadow=true;
    const neck=new THREE.Mesh(new THREE.CylinderGeometry(.24,.28,.32,8),mat(skin));

    const head=new THREE.Mesh(new THREE.SphereGeometry(.52,18,16),mat(skin));
    head.position.y=4.32;head.scale.set(.92,1.05,.95);head.castShadow=true;
    const jaw=sph(.42,10,skin,0,4.12,.06,1,.7,.9,true);
    const hair=new THREE.Mesh(new THREE.SphereGeometry(.55,16,10,0,Math.PI*2,0,Math.PI*.5),mat(hairC));
    hair.position.set(0,4.36,-.05);hair.scale.set(.95,1.02,.98);
    const earL=sph(.12,6,skin,-.5,4.32,0,1,1.2,.7);
    const earR=sph(.12,6,skin,.5,4.32,0,1,1.2,.7);
    i.add(torso,shL,shR,chest,pelvis,neck,head,jaw,hair,earL,earR);
    
    this.legs=[];this.knees=[];
    for(const sx of[-.38,.38]){
      const lg=new THREE.Group();lg.position.set(sx,2.1,0);

      const kn=new THREE.Group();kn.position.y=-.95;
      kn.add(sph(.24,8,skin,0,.02,.02,1,.9,.95,true));

      lg.add(kn);i.add(lg);this.legs.push(lg);this.knees.push(kn);

    this.arms=[];this.forearms=[];
    for(const sx of[-1.02,1.02]){
      const ar=new THREE.Group();ar.position.set(sx,3.62,0);

      const fa=new THREE.Group();fa.position.y=-.82;
      fa.add(sph(.18,8,skin,0,0,0,1,.9,.9,true));
      const fore=new THREE.Mesh(new THREE.CylinderGeometry(.17,.13,.62,10),mat(skin));
      fore.position.y=-.35;fore.castShadow=true;
      const handM=sph(.16,8,hand,0,-.7,.02,1,1.1,.7);
      fa.add(fore,handM);
      ar.add(fa);i.add(ar);this.arms.push(ar);this.forearms.push(fa);
    }
    
    if(!isRef){
      const nc=document.createElement('canvas');nc.width=nc.height=64;
      const nx=nc.getContext('2d');
      nx.fillStyle=gk?'#222':'#fff';nx.font='bold 46px Arial';
      nx.textAlign='center';nx.textBaseline='middle';
      nx.fillText(String(gk?1:this.number),32,34);
      const nm=new THREE.Mesh(new THREE.PlaneGeometry(.85,.85),
        new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(nc),transparent:true}));

    const cv=document.createElement('canvas');cv.width=128;cv.height=48;
    this.lc=cv;this.lt=new THREE.CanvasTexture(cv);
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:this.lt,transparent:true,depthTest:false}));
    sp.scale.set(4.4,1.65,1);sp.position.y=5.75;sp.renderOrder=10;this.sprite=sp;

  setCode(t){
    if(this.code===t)return;this.code=t;
    const c=this.lc.getContext('2d');c.clearRect(0,0,128,48);
    c.fillStyle='rgba(0,0,0,.6)';c.fillRect(6,6,116,36);
    c.fillStyle='#fff';c.font='bold 28px Arial';c.textAlign='center';c.textBaseline='middle';
    c.fillText(t,64,25);
    this.lt.needsUpdate=true;
  }
  setInput(x,y){this.inputX=x;this.inputY=y}
  bound(){this.x=clamp(this.x,PR+M,W-PR-M);this.y=clamp(this.y,PR+M,H-PR-M)}
  kicked(dx,dy){const n=norm(dx,dy);this.kickDirX=n.x;this.kickDirY=n.y;this.kickT=.25}
  slide(){
    if(this.slideCd>0||this.sliding>0||this.isDown)return;
    if(len(this.inputX,this.inputY)<.1){this.slideDirX=this.facing;this.slideDirY=0}
    else{const n=norm(this.inputX,this.inputY);this.slideDirX=n.x;this.slideDirY=n.y}
    this.sliding=.35;this.slideCd=1.5;sfx.slide();
  }
  knockdown(fx,fy){
    if(this.isDown||this.isGK)return false;
    this.isDown=true;this.downTimer=1.5;this.sliding=0;this.hasBall=false;
    const n=norm(this.x-fx,this.y-fy);
    this.vx=n.x*2;this.vy=n.y*2;
    sfx.down();return true;
  }
  update(dt){
    this.slideCd=Math.max(0,this.slideCd-dt);
    this.jump=Math.max(0,this.jump-dt);
    this.bicycleT=Math.max(0,this.bicycleT-dt);
    this.kickT=Math.max(0,this.kickT-dt);
    
    if(this.isDown){
      this.downTimer-=dt;
      this.vx*=.85;this.vy*=.85;
      this.x+=this.vx;this.y+=this.vy;this.bound();
      if(this.downTimer<=0)this.isDown=false;
      return;
    }
    if(this.bicycleT>0){
      this.vx*=.94;this.vy*=.94;
      this.x+=this.vx;this.y+=this.vy;this.bound();
      return;
    }
    if(this.diveT>0){
      this.diveT-=dt;
      this.vx*=.85;this.vy=this.diveV*.8;
    }else if(this.sliding>0){
      this.sliding-=dt;
      this.vx=this.slideDirX*4.5;this.vy=this.slideDirY*4.5;
    }else{
      const il=len(this.inputX,this.inputY);
      const wantSprint=this.isSprinting&&il>.3&&this.stamina>0;
      let maxSp=wantSprint?PLAYER_SPRINT_SPEED:PLAYER_MAX_SPEED;
      if(this.hasBall)maxSp*=.94;
      const accel=wantSprint?PLAYER_ACCEL*1.35:PLAYER_ACCEL;
      
      if(il>.1){
        const n=norm(this.inputX,this.inputY);
        this.vx+=n.x*accel;
        this.vy+=n.y*accel;
        if(Math.abs(n.x)>.3)this.facing=n.x>0?1:-1;
      }
      this.vx*=PLAYER_FRICTION;
      this.vy*=PLAYER_FRICTION;
      const sp=len(this.vx,this.vy);
      if(sp>maxSp){this.vx*=maxSp/sp;this.vy*=maxSp/sp}
      if(wantSprint&&sp>1.5)this.stamina=Math.max(0,this.stamina-45*dt);
      else this.stamina=Math.min(100,this.stamina+20*dt);
    }
    this.x+=this.vx;this.y+=this.vy;this.bound();
    if(this.isGK){
      if(this.team==='red')this.x=Math.min(this.x,M+80);
      else this.x=Math.max(this.x,W-M-80);
    }
    this.walk+=len(this.vx,this.vy)*.12;
  }
  sync(){
    const m=this.mesh,i=this.inner,sp=len(this.vx,this.vy);
    const L=this.legs,K=this.knees,A=this.arms,F=this.forearms;
    m.position.set((this.x-W/2)*S,0,(this.y-H/2)*S);
    
    let th=this.heading,snap=false;
    if(this.bicycleT>0){th=Math.atan2(this.bicycleDirX,this.bicycleDirY);snap=true}
    else if(this.sliding>0){th=Math.atan2(this.slideDirX,this.slideDirY);snap=true}
    else if(this.kickT>0)th=Math.atan2(this.kickDirX,this.kickDirY);
    else if(sp>.3&&!this.isDown)th=Math.atan2(this.vx,this.vy);
    if(this.isGK){th=this.team==='red'?Math.PI/2:-Math.PI/2;snap=true}
    if(snap)this.heading=th;
    else this.heading+=Math.atan2(Math.sin(th-this.heading),Math.cos(th-this.heading))*.28;
    m.rotation.y=this.heading;
    
    i.rotation.set(0,0,0);i.position.y=0;
    const pose=(l0,k0,l1,k1,a0,f0,a1,f1)=>{
      L[0].rotation.x=l0;K[0].rotation.x=k0;
      L[1].rotation.x=l1;K[1].rotation.x=k1;
      A[0].rotation.x=a0;F[0].rotation.x=f0;
      A[1].rotation.x=a1;F[1].rotation.x=f1;
    };
    const az=(l,r)=>{A[0].rotation.z=-l;A[1].rotation.z=r};
    az(.08,.08);
    
    if(this.bicycleT>0){
      const t=1-this.bicycleT/.6;
      i.rotation.x=-Math.PI*.9*t;
      i.position.y=Math.sin(t*Math.PI)*2.5;
      pose(-.4,.9,-1.7,.3,0,-.3,0,-.3);az(1.3,1.3);
    }else if(this.diveT>0){
      i.rotation.z=1.35*Math.sign(this.diveV||1)*(this.team==='red'?1:-1);
      i.position.y=1.6;
      pose(.2,.2,-.2,.3,-3,0,-3,0);az(.15,.15);
    }else if(this.isDown){
      i.rotation.x=-1.5;i.position.y=.5;
      pose(.3,.4,-.1,.7,-.4,-.2,-.4,-.2);az(.8,.8);
    }else if(this.celeb>0){
      i.position.y=Math.abs(Math.sin(this.celeb*9))*1.6;
      pose(.1,.1,.1,.1,-2.9,-.2,-2.9,-.2);az(.5,.5);
    }else if(this.sliding>0){
      i.rotation.x=-1.3;i.position.y=.25;
      pose(-.5,1.5,-1.6,0,.5,-.3,.5,-.3);az(1,1);
    }else if(this.kickT>0){
      const t=1-this.kickT/.25;
      let hipX,kneeX;
      if(t<.3){const u=t/.3;hipX=.7*u;kneeX=1.5*u}
      else if(t<.6){const u=(t-.3)/.3;hipX=.7-2.2*u;kneeX=1.5*(1-u)}
      else{const u=(t-.6)/.4;hipX=-1.5*(1-u);kneeX=.1*(1-u)}
      const lean=Math.sin(Math.min(1,t/.7)*Math.PI);
      i.rotation.x=-.22*lean;
      pose(.15,.25,hipX,kneeX,-1.0*lean,-.45,.8*lean,-.45);
      az(.4,.4);
    }else if(this.jump>0){
      const jt=this.jump/.4;
      i.rotation.x=-.15;
      i.position.y=Math.sin(jt*Math.PI)*1.4;
      pose(-.35,1.0,-.25,.8,-1.7,-.3,-1.7,-.3);az(.6,.6);
    }else{
      const amp=clamp(sp/(PLAYER_SPRINT_SPEED*.8),0,1);
      const stride=amp*.85,s=Math.sin(this.walk),c=Math.cos(this.walk);
      const bodyLean=sp*.1+amp*.12;
      const legF=s*stride,legB=-s*stride;
      const kneeF=Math.max(0,-c)*amp*1.5;
      const kneeB=Math.max(0,c)*amp*1.5;
      const armF=-s*amp*.9,armB=s*amp*.9;
      const elbow=-.25-amp*.55;
      pose(legF,kneeF,legB,kneeB,armF,elbow,armB,elbow);
      i.rotation.x=bodyLean;
      i.position.y=-(2.1*(1-Math.cos(amp*Math.abs(s))))*.75;
      i.rotation.z=Math.sin(this.walk)*amp*.05;
    }
  }
}

/* ================== فيزياء الكرة ================== */
const ball={
  x:W/2,y:H/2,h:0,
  vx:0,vy:0,vh:0,
  spin:0,
  lastTouch:null,
  cd:0,
  target:null,
  land:null,
  shot:0,
  update(dt){
    this.cd=Math.max(0,this.cd-dt);
    this.x+=this.vx;this.y+=this.vy;
    
    if(this.h>0||this.vh>0){
      this.h+=this.vh;
      this.vh-=BALL_GRAVITY;
      this.vx*=BALL_AIR_DRAG;
      this.vy*=BALL_AIR_DRAG;
      if(this.spin){
        const p=norm(this.vy||1,this.vx||1);
        this.vx+=p.y*this.spin*.008;
        this.vy-=p.x*this.spin*.008;
        this.spin*=.985;
      }
      if(this.h<=0){
        this.h=0;
        if(this.vh<-2){
          this.vh=-this.vh*BALL_RESTITUTION;
          this.vx*=.85;this.vy*=.85;
          this.spin*=.7;
        }else{this.vh=0;this.spin*=.5}
      }
    }else{
      this.vx*=BALL_FRICTION;
      this.vy*=BALL_FRICTION;
      this.target=null;
      if(Math.abs(this.vx)<.03)this.vx=0;
      if(Math.abs(this.vy)<.03)this.vy=0;
    }
    
    /* القوائم */
    for(const px of[M,W-M])for(const py of[H/2-GH/2,H/2+GH/2]){
      const dx=this.x-px,dy=this.y-py,d=Math.hypot(dx,dy);
      if(d<BR+3&&this.h<50){
        const n=d?{x:dx/d,y:dy/d}:{x:px<W/2?1:-1,y:0};
        const vn=this.vx*n.x+this.vy*n.y;
        if(vn<0){
          this.vx-=1.7*vn*n.x;this.vy-=1.7*vn*n.y;
          this.vx*=.8;this.vy*=.8;
          if(Math.abs(vn)>1.5)sfx.post();
        }
        this.x=px+n.x*(BR+3);this.y=py+n.y*(BR+3);
      }
    }
    
    /* خروج الكرة من الخطوط الجانبية */
    if(this.y-BR<M-2)return{out:'side',y:M};
    if(this.y+BR>H-M+2)return{out:'side',y:H-M};
    
    const inGoal=this.y>H/2-GH/2&&this.y<H/2+GH/2&&this.h<50;
    if(this.x-BR<M){
      if(inGoal&&this.x-BR<M-8)return'right';
      if(!inGoal&&this.x-BR<M-6)return{out:'end',end:-1};
    }
    if(this.x+BR>W-M){
      if(inGoal&&this.x+BR>W-M+8)return'left';
      if(!inGoal&&this.x+BR>W-M+6)return{out:'end',end:1};
    }
    return null;
  }

redTeam[0].homeY=greenTeam[0].homeY=H/2;
applyFormation(redTeam,'2-2');applyFormation(greenTeam,'2-2');
for(let n=6;n<=8;n++){
  const b=new Player(0,0,'red',n,'DEF');b.mesh.visible=false;redBench.push(b);
}
const getControlled=()=>redTeam[selectedRed];
const ref=new Player(W/2,M-26,'ref',0,'REF');ref.sprite.visible=false;
const opp=t=>t==='red'?greenTeam:redTeam;
const mates=t=>t==='red'?redTeam:greenTeam;

function setSelected(idx,lock=.5){
  if(idx<0||idx===selectedRed)return;
  const o=redTeam[selectedRed];
  if(o){o.isSprinting=false;o.setInput(0,0)}
  selectedRed=idx;switchLock=lock;sfx.sw();
}
function switchPlayer(){
  let best=-1,bd=Infinity;
  redTeam.forEach((p,i)=>{
    if(i===selectedRed||p.isGK||p.isDown)return;
    const d=dist(p.x,p.y,ball.x,ball.y);
    if(d<bd){bd=d;best=i}
  });
  setSelected(best,1.5);
}
function autoSwitchToPossessor(p){
  if(p&&!p.isGK&&p.team==='red')setSelected(redTeam.indexOf(p));
}
function autoSwitch(dt){
  switchLock=Math.max(0,switchLock-dt);
  const cur=getControlled();
  if(switchLock>0||cur.sliding>0)return;
  if(ball.target&&ball.target.team==='red'&&(ball.h>0||ball.vh>0))return;
  const poss=findPossessor();
  if(poss&&poss.team==='red'){autoSwitchToPossessor(poss);return}
  const tx=poss?poss.x:ball.x+ball.vx*6,ty=poss?poss.y:ball.y+ball.vy*6;
  let best=-1,bd=Infinity;
  redTeam.forEach((p,i)=>{
    if(p.isGK||p.isDown)return;
    const d=dist(p.x,p.y,tx,ty);
    if(d<bd){bd=d;best=i}
  });
  const cd=cur.isDown?Infinity:dist(cur.x,cur.y,tx,ty);
  if(best!==selectedRed&&bd<cd*.85-8)setSelected(best);
}

/* ================== التحكم بالكرة ================== */
function findPossessor(){
  let c=null,cd=Infinity;
  for(const p of all()){
    if(p.isDown)continue;
    const d=dist(p.x,p.y,ball.x,ball.y);
    if(d<cd){cd=d;c=p}
  }
  return cd<36&&ball.h<14?c:null;
}

function handleBallControl(){
  gkSave();
  if(ball.cd>0||ball.h>14)return;
  let c=null,cd=Infinity;
  for(const p of all()){
    if(p.isDown)continue;
    const d=dist(p.x,p.y,ball.x,ball.y);
    if(d<cd){cd=d;c=p}
  }
  if(!c||cd>=(c.hasBall?c.radius+BR+16:c.radius+BR+4))return;
  
  const bs=len(ball.vx,ball.vy),prev=ball.lastTouch;
  
  if(c.isGK&&prev&&prev.team!==c.team&&bs<6){
    c.hasBall=true;
    ball.vx=ball.vy=0;ball.x=c.x+(c.team==='red'?12:-12);ball.y=c.y;
    ball.lastTouch=c;
    return;
  }
  
  if(c.hasBall){
    let stolen=false;
    for(const o of opp(c.team)){
      if(o.isDown)continue;
      const dToPlayer=dist(o.x,o.y,c.x,c.y);
      const dToBall=dist(o.x,o.y,ball.x,ball.y);
      if(dToPlayer<c.radius+o.radius+3){
        if(o.sliding>0||dToBall<dist(c.x,c.y,ball.x,ball.y)+3){
          stolen=true;break;
        }
      }
    }
    if(!stolen){
      /* دريبل واقعي: الكرة أبعد عند الركض السريع فتصبح أسهل للافتكاك */
      const sp=len(c.vx,c.vy);
      const d=sp>.3?norm(c.vx,c.vy):{x:c.facing,y:0};
      const ahead=DRIBBLE_DIST+sp*(c.isSprinting?2.6:1.4);
      const targetX=clamp(c.x+d.x*ahead,M+BR+2,W-M-BR-2);
      const targetY=clamp(c.y+d.y*ahead,M+BR+2,H-M-BR-2);
      ball.x+=(targetX-ball.x)*.4;
      ball.y+=(targetY-ball.y)*.4;
      ball.vx=c.vx*1.02;ball.vy=c.vy*1.02;
      ball.lastTouch=c;
      autoSwitchToPossessor(c);
      return;
    }
    c.hasBall=false;
  }
  
  if(prev&&prev.team!==c.team&&prev.hasBall&&prev!==c&&bs>1)return;
  
  /* لمسة أولى: الكرات السريعة قد ترتد بعيداً قليلاً */
  const heavy=bs>7&&!c.isGK&&Math.random()<clamp((bs-7)*.06,0,.45);
  if(heavy){
    ball.vx=ball.vx*.3+c.vx*.5;ball.vy=ball.vy*.3+c.vy*.5;
    ball.lastTouch=c;ball.cd=.15;
    sfx.touch();autoSwitchToPossessor(c);
    return;
  }
  
  c.hasBall=true;
  ball.vx=c.vx*1.05;ball.vy=c.vy*1.05;
  ball.lastTouch=c;ball.cd=.08;
  sfx.touch();
  autoSwitchToPossessor(c);
}

function kickBall(p,power,dx=null,dy=null,speed=null,lift=0){
  if(p.isDown||ball.h>14||dist(p.x,p.y,ball.x,ball.y)>KICK_RANGE)return false;
  const n=dx!==null?norm(dx,dy):len(p.vx,p.vy)>.5?norm(p.vx,p.vy):{x:p.facing,y:0};
  
  const playerMomentum=len(p.vx,p.vy)*.5;
  const baseSpeed=speed!==null?speed:(3.5+power*9+playerMomentum*1.5);
  
  const spread=(.03+.1*power)*(p.isSprinting?1.3:1)*(underPressure(p,p.team)?1.2:1);
  const a=(Math.random()-.5)*spread;
  const nx=n.x*Math.cos(a)-n.y*Math.sin(a);
  const ny=n.x*Math.sin(a)+n.y*Math.cos(a);
  
  p.hasBall=false;
  ball.vx=nx*baseSpeed;
  ball.vy=ny*baseSpeed;
  ball.x=p.x+nx*(DRIBBLE_DIST+2);
  ball.y=p.y+ny*(DRIBBLE_DIST+2);
  ball.shot++;ball.vh=lift;ball.h=lift?.5:0;
  ball.spin=(Math.random()-.5)*baseSpeed*.3;
  ball.lastTouch=p;ball.cd=.25;
  p.kicked(nx,ny);
  sfx.kick(power);
  return true;
}

function passTo(p,m,power){
  const D=dist(p.x,p.y,m.x,m.y);
  if(D<5)return false;
  const baseSpeed=clamp(2.2+D*.022,3.5,10);
  const T=D/((baseSpeed+2.2)/2);
  const tx=clamp(m.x+m.vx*T*.55,M+10,W-M-10);
  const ty=clamp(m.y+m.vy*T*.55,M+10,H-M-10);
  return kickBall(p,Math.max(.3,power*.7),tx-ball.x,ty-ball.y,baseSpeed);
}

function lob(p,r){
  if(p.isDown||ball.h>14||dist(p.x,p.y,ball.x,ball.y)>KICK_RANGE)return false;
  const D=dist(ball.x,ball.y,r.x,r.y);
  if(D<10)return false;
  const T=clamp(D/5,35,70);
  const tx=clamp(r.x+r.vx*T*.6,M+15,W-M-15);
  const ty=clamp(r.y+r.vy*T*.6,M+15,H-M-15);
  p.hasBall=false;
  ball.vx=(tx-ball.x)/T;
  ball.vy=(ty-ball.y)/T;
  ball.vh=.5*BALL_GRAVITY*(T-1);
  ball.h=.1;
  ball.shot++;ball.lastTouch=p;ball.cd=.28;ball.target=r;
  ball.land={x:tx,y:ty};
  const ln=norm(tx-ball.x,ty-ball.y);
  p.kicked(ln.x,ln.y);
  sfx.kick(.5);
  return true;
}

/* افتكاك واقف */
function poke(p,c){
  if(c.isDown||p.isDown||dist(p.x,p.y,ball.x,ball.y)>34)return false;
  if(Math.random()<(c.isSprinting?.7:.45)){
    c.hasBall=false;
    const n=norm(ball.x-p.x,ball.y-p.y);
    ball.vx=n.x*3.2+c.vx*.3;ball.vy=n.y*3.2+c.vy*.3;
    ball.lastTouch=p;ball.cd=.2;
    p.kicked(n.x,n.y);sfx.touch();
    return true;
  }
  return false;
}

const canHead=p=>!p.isDown&&p.bicycleT<=0&&ball.h>=14&&ball.h<=55&&dist(p.x,p.y,ball.x,ball.y)<28;
const canBicycle=p=>!p.isDown&&p.bicycleT<=0&&ball.h>=38&&ball.h<=75&&dist(p.x,p.y,ball.x,ball.y)<40;

function head(p,power,dx,dy){
  const n=norm(dx,dy),st=2.5+power*7;
  p.hasBall=false;
  ball.shot++;
  ball.vx=n.x*st;ball.vy=n.y*st;
  ball.vh=1;ball.lastTouch=p;ball.cd=.3;ball.target=null;
  p.jump=.4;
  sfx.kick(power*.7);
}
function bicycleKick(p,dx,dy){
  const n=norm(dx,dy),st=4+Math.random()*4.5;
  p.bicycleT=.6;p.bicycleDirX=n.x;p.bicycleDirY=n.y;p.jump=.6;p.hasBall=false;
  ball.shot++;
  ball.vx=n.x*(st*1.15-.2);
  ball.vy=n.y*(st*1.15-.2);
  ball.vh=1.8;ball.lastTouch=p;ball.cd=.35;ball.target=null;
  sfx.bicycle();sfx.kick(.8);
}

/* ================== الحارس ================== */
let diff=1;
const gkRoll=g=>{if(g.shot!==ball.shot){g.shot=ball.shot;g.roll=Math.random()}};
const saveChance=(g,bs)=>(bs<7?.85:bs<10?.5:.35)*(g.team==='green'?diff:1)*(superActive()?.35:1);

function gkSave(){
  const bs=len(ball.vx,ball.vy);
  if(bs<2.5||!ball.lastTouch||ball.h>55)return;
  for(const g of [redTeam[0],greenTeam[0]]){
    if(ball.lastTouch.team===g.team||g.isDown)continue;
    gkRoll(g);
    if(dist(g.x,g.y,ball.x,ball.y)>(g.diveT>0?38:26))continue;
    if(g.roll>=saveChance(g,bs)){ball.cd=Math.max(ball.cd,.35);continue}
    if(ball.lastTouch)ball.lastTouch.hasBall=false;
    if(bs<6){
      ball.vx=ball.vy=ball.vh=0;ball.h=0;
      ball.x=g.x+(g.team==='red'?14:-14);ball.y=g.y;
      g.thinkCd=.8;g.hasBall=true;
    }else{
      ball.vx=-ball.vx*.35+(g.team==='red'?1.5:-1.5);
      ball.vy=ball.vy*.5+(Math.random()-.5)*4;
      ball.vh=1.5;
    }
    ball.lastTouch=g;ball.cd=.3;g.jump=.4;
    sfx.touch();return;
  }
}

/* ================== الأخطاء وإعادة اللعب ================== */
let foulInfo=null;
let restartTaker=null,restartT=0,restartKind='';
function callFoul(at,v){
  const pen=at.team==='red'?(v.x<M+90&&Math.abs(v.y-H/2)<140):(v.x>W-M-90&&Math.abs(v.y-H/2)<140);
  foulInfo={team:v.team,x:v.x,y:v.y,pen,kind:'foul',label:pen?'🥅 ضربة جزاء!':'🟨 مخالفة!'};
  state='foul';phaseT=2;
  sfx.whistle();
  if(v)v.hasBall=false;
}
function callRestart(kind,team,x,y){
  const L={throw:'رمية تماس',corner:'ركنية',goalkick:'ضربة مرمى'};
  foulInfo={team,x,y,pen:false,kind,label:'⚽ '+L[kind]};
  state='foul';phaseT=1.3;
  sfx.out();
  if(ball.lastTouch)ball.lastTouch.hasBall=false;
}
function handleOut(o){
  const lt=ball.lastTouch,lastTeam=lt?lt.team:'green';
  if(o.out==='side'){
    callRestart('throw',lastTeam==='red'?'green':'red',clamp(ball.x,M+40,W-M-40),o.y);
  }else{
    const defTeam=o.end<0?'red':'green';
    if(lastTeam===defTeam){
      callRestart('corner',defTeam==='red'?'green':'red',o.end<0?M:W-M,ball.y<H/2?M:H-M);
    }else callRestart('goalkick',defTeam,o.end<0?M:W-M,H/2);
  }
}
function setPiece(f){
  const team=f.team,dir=team==='red'?1:-1,kind=f.kind;
  for(const p of all()){
    p.vx=p.vy=0;p.isDown=false;p.sliding=0;p.diveT=0;p.bicycleT=0;p.kickT=0;
    p.setInput(0,0);p.hasBall=false;
  }
  let bx,by;
  if(f.pen){bx=team==='red'?W-M-70:M+70;by=H/2}
  else if(kind==='throw'){bx=clamp(f.x,M+30,W-M-30);by=f.y<H/2?M+BR:H-M-BR}
  else if(kind==='corner'){bx=f.x<W/2?M+BR+2:W-M-BR-2;by=f.y<H/2?M+BR+2:H-M-BR-2}
  else if(kind==='goalkick'){bx=f.x<W/2?M+60:W-M-60;by=H/2}
  else{bx=clamp(f.x,M+BR,W-M-BR);by=clamp(f.y,M+BR,H-M-BR)}
  Object.assign(ball,{x:bx,y:by,vx:0,vy:0,vh:0,h:0,cd:0,target:null,spin:0});
  
  let tk=null,bd=1e9;
  if(kind==='goalkick')tk=mates(team)[0];
  else mates(team).forEach(p=>{
    if(p.isGK)return;
    const d=dist(p.x,p.y,bx,by);if(d<bd){bd=d;tk=p}
  });
  if(kind==='throw'){tk.x=bx;tk.y=by+(by<H/2?1:-1)*22}
  else if(kind==='corner'){tk.x=bx+(bx<W/2?22:-22);tk.y=by+(by<H/2?4:-4)}
  else if(kind==='goalkick'){tk.x=bx-12*dir;tk.y=by;tk.thinkCd=.8}
  else{tk.x=bx-22*dir;tk.y=by}
  tk.bound();
  ball.lastTouch=tk;tk.hasBall=true;
  
  if(f.pen){
    let i=0;
    for(const p of all()){
      if(p===tk||p.isGK)continue;
      p.x=W/2+(p.team==='red'?-30:30)*(1+i%2);
      p.y=H/2+(i++-4)*45;p.bound();
    }
    const g=opp(team)[0];
    g.x=team==='red'?W-M-12:M+12;g.y=H/2;
  }else if(kind==='corner'){
    const gx=bx<W/2?M:W-M,inx=bx<W/2?1:-1;
    let i=0;
    for(const p of mates(team)){
      if(p===tk||p.isGK)continue;
      p.x=gx+inx*(75+i*10);p.y=H/2+(i-1)*70;p.bound();i++;
    }
    i=0;
    for(const p of opp(team)){
      if(p.isGK)continue;
      p.x=gx+inx*(55+(i%2)*25);p.y=H/2+(i-1.5)*55;p.bound();i++;
    }
  }else if(kind==='goalkick'){
    const gx=bx<W/2?M:W-M,inx=bx<W/2?1:-1;
    for(const p of all()){
      if(p.isGK||p===tk)continue;
      if((p.x-gx)*inx<170)p.x=gx+inx*(170+Math.random()*60);
      p.bound();
    }
  }else{
    const R2=kind==='throw'?80:110;
    for(const p of opp(team)){
      if(p.isGK)continue;
      const d=dist(p.x,p.y,bx,by);
      if(d<R2){
        const n=norm(p.x-bx,p.y-by);
        p.x=bx+n.x*R2;p.y=by+n.y*R2;p.bound();
      }
    }
  }
  restartTaker=(team==='red'&&!tk.isGK)?null:tk;restartT=.7;restartKind=kind;
  if(team==='red'&&!tk.isGK)setSelected(redTeam.indexOf(tk),.5);
}

/* ================== الذكاء الاصطناعي ================== */
function aiUpdate(dt){
  const poss=findPossessor();
  all().forEach(p=>p.thinkCd=Math.max(0,p.thinkCd-dt));
  redTeam.forEach((p,i)=>{
    if(i!==selectedRed&&!p.isDown)aiPlayer(p,'red',poss);
  });
  greenTeam.forEach(p=>{if(!p.isDown)aiPlayer(p,'green',poss)});
}

function aiPlayer(p,team,poss){
  if(p.bicycleT>0)return;
  /* فريق المستخدم لا يسدد ولا يمرر تلقائياً: عند امتلاك الكرة يتحكم به المستخدم */
  if(team==='red'&&!p.isGK){
    if(restartTaker===p)restartTaker=null;
    if(poss===p){setSelected(redTeam.indexOf(p),.3);p.setInput(0,0);return}
  }
  if(restartTaker===p){
    if(!p.hasBall)restartTaker=null;
    else{
      if(restartT>0){p.setInput(0,0);return}
      const m=bestPass(p,team);
      let ok=false;
      if(m)ok=restartKind==='corner'?lob(p,m):passTo(p,m,.5);
      if(!ok)ok=kickBall(p,.5,team==='red'?1:-1,0);
      restartTaker=null;p.thinkCd=1;
      return;
    }
  }
  if(!p.isGK&&ball.target===p&&ball.land&&(ball.h>0||ball.vh>0)){
    p.isSprinting=true;aiMoveTo(p,ball.land.x,ball.land.y);return;
  }
  if(team==='green'&&!p.isGK&&canHead(p)&&ball.cd===0&&ball.vh<=0){
    const gx=team==='red'?W-M:M;
    const near=Math.abs(gx-p.x)<380;
    const m=near?null:bestPass(p,team);
    head(p,.6+Math.random()*.3,(near?gx:m?m.x:gx)-p.x,(near?H/2:m?m.y:H/2)-p.y);
    return;
  }
  if(team==='green'&&!p.isGK&&canBicycle(p)&&ball.cd===0&&ball.vh<=0&&poss&&poss.team!==team){
    const gx=team==='red'?W-M:M;
    const toBallX=ball.x-p.x,toBallY=ball.y-p.y;
    const n=team==='red'?{x:1,y:0}:{x:-1,y:0};
    if(n.x*toBallX+n.y*toBallY<0){bicycleKick(p,gx-p.x,H/2-p.y);return}
  }
  const has=poss&&poss.team===team;
  const dB=dist(p.x,p.y,ball.x,ball.y);
  p.isSprinting=p.stamina>40&&(poss===p||(!has&&dB>150&&dB<400));
  if(p.isGK)return aiGK(p,team);
  if(has)aiAttack(p,team,poss);else aiDefend(p,team,poss);
}

const underPressure=(p,t)=>opp(t).some(o=>!o.isDown&&dist(o.x,o.y,p.x,p.y)<55);

function bestPass(p,team){
  const gx=team==='red'?W-M:M;
  let best=null,bs=-Infinity;
  for(const m of mates(team)){
    if(m===p||m.isGK||m.isDown)continue;
    const d=dist(p.x,p.y,m.x,m.y);
    if(d<60||d>420)continue;
    const free=Math.min(...opp(team).map(o=>dist(o.x,o.y,m.x,m.y)));
    const forward=(Math.abs(p.x-gx)-Math.abs(m.x-gx))*.6;
    const s=free+forward-d*.15;
    if(s>bs){bs=s;best=m}
  }
  return best;
}

function aiGK(gk,team){
  const gx=team==='red'?M:W-M;
  
  if(gk.hasBall){
    if(gk.thinkCd===0){
      const m=bestPass(gk,team);
      const ok=m?passTo(gk,m,.55):kickBall(gk,.55,W/2-gk.x,H/2-gk.y);
      if(ok){gk.thinkCd=1.5;return}
    }
    aiMoveTo(gk,gx+(team==='red'?30:-30),H/2);
    return;
  }
  
  if(gk.diveT<=0&&ball.lastTouch&&ball.lastTouch.team!==team&&ball.h<55&&len(ball.vx,ball.vy)>4&&ball.vx){
    gkRoll(gk);
    const t=(gx-ball.x)/ball.vx;
    if(gk.roll<saveChance(gk,len(ball.vx,ball.vy))+.2&&t>2&&t<26){
      const ya=ball.y+ball.vy*t+(Math.random()-.5)*40;
      if(Math.abs(ya-H/2)<GH/2+20&&Math.abs(ya-gk.y)>16){
        gk.diveT=.45;
        gk.diveV=clamp((ya-gk.y)/Math.max(6,t*.8),-4.8,4.8);
      }
    }
  }
  if(gk.diveT>0)return;
  
  let tx=gx+(team==='red'?30:-30),ty=H/2;
  if(team==='red'?ball.x<W*.35:ball.x>W*.65){
    ty=clamp(H/2+Math.sin(Math.atan2(ball.y-H/2,ball.x-gx))*50,H/2-GH/2+15,H/2+GH/2-15);
    if(dist(ball.x,ball.y,gx,H/2)<100){tx=ball.x;ty=ball.y}
  }
  aiMoveTo(gk,tx,ty);
}

function aiAttack(p,team,poss){
  const gx=team==='red'?W-M:M;
  const dir=team==='red'?1:-1;
  if(poss===p){
    if(p.thinkCd===0&&Math.abs(gx-p.x)<320&&Math.abs(p.y-H/2)<240){
      const gk=opp(team)[0];
      const ay=H/2+(gk.y>H/2?-1:1)*50;
      if(kickBall(p,.55+Math.random()*.35,gx-p.x,ay-p.y)){p.thinkCd=1.2;return}
    }
    if(p.thinkCd===0&&underPressure(p,team)&&Math.random()<.1){
      const m=bestPass(p,team);
      if(m&&passTo(p,m,.5)){p.thinkCd=1;return}
    }
    /* تمريرة للأمام لزميل حر */
    if(p.thinkCd===0&&Math.random()<.012){
      const m=bestPass(p,team);
      if(m&&(Math.abs(p.x-gx)-Math.abs(m.x-gx))>40){
        const free=Math.min(...opp(team).map(o=>dist(o.x,o.y,m.x,m.y)));
        if(free>80&&passTo(p,m,.5)){p.thinkCd=1;return}
      }
    }
    const g=norm(gx-p.x,H/2-p.y);
    let dx=g.x,dy=g.y;
    for(const o of opp(team)){
      if(o.isDown)continue;
      const d=dist(o.x,o.y,p.x,p.y)||1;
      if(d<90){dx+=(p.x-o.x)/d*(90-d)/45;dy+=(p.y-o.y)/d*(90-d)/45}
    }
    const n=norm(dx,dy);
    aiMoveTo(p,p.x+n.x*100,p.y+n.y*100);
    return;
  }
  if(dist(p.x,p.y,ball.x,ball.y)<150&&p.role!=='DEF'){
    aiMoveTo(p,ball.x+(team==='red'?100:-100),clamp(ball.y+(p.homeY<H/2?-60:60),M+30,H-M-30));
    return;
  }
  if(p.role==='DEF'){
    const pr=team==='red'?(ball.x-M)/(W-2*M):1-(ball.x-M)/(W-2*M);
    aiMoveTo(p,clamp(p.homeX+(team==='red'?pr*120:-pr*120),M+30,W-M-30),p.homeY+(ball.y-H/2)*.3);
  }else{
    /* جري بدون كرة: التقدم أمام حامل الكرة والابتعاد عن المدافعين */
    const tx=clamp(ball.x+dir*(p.role==='FWD'?170:90),M+80,W-M-80);
    let ty=H/2+(p.homeY-H/2)*.9;
    let nd=Infinity,no=null;
    for(const o of opp(team)){
      if(o.isGK||o.isDown)continue;
      const d=dist(o.x,o.y,tx,ty);
      if(d<nd){nd=d;no=o}
    }
    if(no&&nd<80)ty+=(ty>=no.y?1:-1)*(80-nd);
    aiMoveTo(p,tx,clamp(ty,M+30,H-M-30));
  }
}

function aiDefend(p,team,poss){
  const ownGX=team==='red'?M:W-M;
  const dirOwn=team==='red'?-1:1;
  let chaser=null,bd=Infinity;
  mates(team).forEach((m,i)=>{
    if((team==='red'&&i===selectedRed)||m.isGK||m.isDown)return;
    const d=dist(m.x,m.y,ball.x,ball.y);
    if(d<bd){bd=d;chaser=m}
  });
  const carrier=poss&&poss.team!==team?poss:null;
  if(chaser===p){
    if(carrier){
      const d=dist(p.x,p.y,carrier.x,carrier.y);
      const g=norm(ownGX-carrier.x,H/2-carrier.y);
      /* مراوغة دفاعية: التمركز بين المهاجم والمرمى ثم الاقتراب */
      if(d>55)aiMoveTo(p,carrier.x+g.x*28,carrier.y+g.y*28);
      else aiMoveTo(p,ball.x+ball.vx*3,ball.y+ball.vy*3);
      if(d<44&&p.thinkCd===0){
        const r=Math.random();
        if(r<.025){p.slide();p.thinkCd=2.5}
        else if(r<.06&&d<34){poke(p,carrier);p.thinkCd=.9}
      }
    }else aiMoveTo(p,ball.x+ball.vx*4,ball.y+ball.vy*4);
  }else if(p.role==='DEF'){
    /* مراقبة أخطر مهاجم من جهة المرمى */
    let tgt=null,ts=Infinity;
    for(const o of opp(team)){
      if(o.isGK||o.isDown)continue;
      const s=Math.abs(o.x-ownGX)*.6+Math.abs(o.y-p.homeY);
      if(s<ts){ts=s;tgt=o}
    }
    if(tgt)aiMoveTo(p,clamp(tgt.x+dirOwn*32,M+30,W-M-30),clamp(tgt.y*.7+p.homeY*.3,M+30,H-M-30));
    else aiMoveTo(p,team==='red'?W*.28:W*.72,p.homeY*.7+ball.y*.3);
  }else{
    aiMoveTo(p,clamp(ball.x+(ownGX-ball.x)*.4,M+40,W-M-40),clamp(ball.y*.5+H/4+(p.homeY-H/2)*.3,M+30,H-M-30));
  }
}

function aiMoveTo(p,tx,ty){
  const dx=tx-p.x,dy=ty-p.y,d=len(dx,dy);
  if(d<8)p.setInput(0,0);
  else{const n=norm(dx,dy),s=Math.min(1,d/50);p.setInput(n.x*s,n.y*s)}
}

/* ================== اصطدامات ================== */
function checkSlides(){
  const a=all();
  for(const at of a){
    if(at.sliding<=0||at.isDown)continue;
    for(const t of a){
      if(t===at||t.team===at.team||t.isDown||t.isGK)continue;
      if(dist(at.x,at.y,t.x,t.y)<at.radius+t.radius+4){
        const tHasBall=t.hasBall;
        if(t.knockdown(at.x,at.y)){
          if(tHasBall){
            t.hasBall=false;
            if(dist(at.x,at.y,ball.x,ball.y)<40&&at.sliding>0){
              at.hasBall=true;ball.lastTouch=at;ball.cd=.1;
            }
          }
          if(!(dist(t.x,t.y,ball.x,ball.y)<32&&ball.h<14)){callFoul(at,t);return}
          if(t===getControlled())setTimeout(switchPlayer,50);
        }
      }
    }
  }
}

function resolveCollisions(){
  const a=all();
  for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){
    const p=a[i],q=a[j];
    const dx=q.x-p.x,dy=q.y-p.y,d=len(dx,dy),md=p.radius+q.radius;
    if(d<md&&d>0){
      const nx=dx/d,ny=dy/d,o=(md-d)/2;
      if(!p.isDown){p.x-=nx*o;p.y-=ny*o}
      if(!q.isDown){q.x+=nx*o;q.y+=ny*o}
    }
  }
}

function applyInputs(){

      const dx=ball.x-p.x,dy=ball.y-p.y,d=len(dx,dy);
      if(d>15){const n=norm(dx,dy);ix=n.x;iy=n.y}
    }

  }else{

      if(keys.KeyW||keys.ArrowUp)iy-=1;

/* أزرار متعددة اللمس: كل إصبع يُتتبَّع على مستوى النافذة فلا يعطّل أي زر آخر */
const holds=[],ptrBtn=new Map();
function hold(el,down,up){
  const active=new Set();
  holds.push({
    el,
    begin(id){
      if(active.has(id))return;
      active.add(id);el.classList.add('on');
      if(active.size===1)down();
    },
    end(id){
      if(!active.delete(id))return;
      if(active.size===0){el.classList.remove('on');up&&up()}
    }
  });
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
addEventListener('pointerdown',e=>{
  const h=holds.find(h=>h.el===e.target||h.el.contains(e.target));
  if(!h)return;
  e.preventDefault();
  ptrBtn.set(e.pointerId,h);
  h.begin(e.pointerId);
},{capture:true,passive:false});
const relPtr=e=>{
  const h=ptrBtn.get(e.pointerId);
  if(h){ptrBtn.delete(e.pointerId);h.end(e.pointerId)}
};

function currentAimDir(){
  const p=getControlled();
  if(len(joy.vx,joy.vy)>.25)return norm(joy.vx,joy.vy);
  if(len(p.vx,p.vy)>.5)return norm(p.vx,p.vy);
  if(!sprintHeld&&len(p.inputX,p.inputY)>.25)return norm(p.inputX,p.inputY);
  return {x:p.facing,y:0};
}
function nearestMateInAimDir(p,aim){
  let best=null,bs=-1e9;
  for(const m of redTeam){
    if(m===p||m.isGK||m.isDown)continue;
    const d=dist(p.x,p.y,m.x,m.y);
    if(d<50)continue;
    const c=((m.x-p.x)*aim.x+(m.y-p.y)*aim.y)/(d||1);
    if(c<.4)continue;
    const free=Math.min(...greenTeam.map(o=>dist(o.x,o.y,m.x,m.y)));
    const s=c*3-d/400+free/200;
    if(s>bs){bs=s;best=m}
  }
  return best;
}
function goalInAimDir(p,aim){
  const gx=W-M-p.x,gy=H/2-p.y,gd=len(gx,gy)||1;
  return (gx*aim.x+gy*aim.y)/gd>.4;
}

function doPass(power){
  const p=getControlled();
  if(!p||p.isDown)return;
  if(canBicycle(p)){
    const aim=currentAimDir();
    if(aim.x*(ball.x-p.x)+aim.y*(ball.y-p.y)<0){
      bicycleKick(p,aim.x*3,aim.y*3);return;
    }
  }
  if(canHead(p)){
    const aim=currentAimDir();
    const useGoal=goalInAimDir(p,aim);
    head(p,power,useGoal?(W-M-p.x):aim.x*2,useGoal?(H/2-p.y):aim.y*2);
    return;
  }
  const aim=currentAimDir();
  const nearMate=nearestMateInAimDir(p,aim);
  if(nearMate){
    if(passTo(p,nearMate,clamp(power,.3,1)))setSelected(redTeam.indexOf(nearMate),.4);
    else sfx.touch();
    return;
  }
  if(!kickBall(p,Math.max(.3,power),aim.x,aim.y))sfx.touch();
}

function doShoot(power){
  const p=getControlled();
  if(!p||p.isDown)return;
  if(canBicycle(p)){
    const aim=currentAimDir();
    if(aim.x*(ball.x-p.x)+aim.y*(ball.y-p.y)<0){
      bicycleKick(p,aim.x*3,aim.y*3);return;
    }
  }
  if(canHead(p)){
    head(p,power,W-M-p.x,H/2-p.y);
    return;
  }
  const aim=currentAimDir();
  const g=norm(W-M-ball.x,H/2-ball.y);
  const n=norm(g.x*.7+aim.x*.3,g.y*.7+aim.y*.3);
  const lift=clamp((power-.6)*6,0,2.4);
  if(!kickBall(p,Math.max(.4,power),n.x,n.y,null,lift))sfx.touch();
}

/* التسديد الخارق: من المستوى 2، 3 مرات في كل مباراة، عند إكمال شحن زر التسديد */
const superLvl=()=>acct.level>=2?Math.min(acct.level,20):0;
function doSuper(){
  const p=getControlled();
  if(!p||p.isDown||superLeft<=0||!superLvl())return false;
  if(ball.h>14||dist(p.x,p.y,ball.x,ball.y)>KICK_RANGE)return false;
  const aim=currentAimDir();
  const g=norm(W-M-ball.x,H/2-ball.y);
  const n=norm(g.x*.75+aim.x*.25,g.y*.75+aim.y*.25);
  if(!kickBall(p,1,n.x,n.y,18))return false;
  ball.supShot=ball.shot;ball.supOwner=p;
  superLeft--;slowT=1.1;sfx.super();
  return true;
}

const CAMS={1:[14,20],2:[20,28],3:[28,40],4:[38,55]};
const camPos=new THREE.Vector3(0,40,55),camLook=new THREE.Vector3();
const tp=new THREE.Vector3(),tl=new THREE.Vector3(),ax=new THREE.Vector3();

function render3d(ts,fs=1){
  all().forEach(p=>p.sync());
  const bx=(ball.x-W/2)*S,bz=(ball.y-H/2)*S;
  ballMesh.position.set(bx,BR*S+ball.h*S,bz);
  const sp=len(ball.vx,ball.vy);
  if(sp>.01){
    ax.set(ball.vy,0,-ball.vx).normalize();
    ballMesh.rotateOnWorldAxis(ax,sp*S/(BR*S)*fs);
  }
  applyBallFx(ts,fs,bx,bz);
  updParts(fs/60);
  const c=getControlled();
  selM.visible=!c.isDown;
  selM.position.set(c.mesh.position.x,0,c.mesh.position.z);
  cone.position.y=6.6+Math.sin(ts*.008)*.4;
  
  /* حلقة هدف التمريرة */
  let tm=null;
  if(state==='playing'&&c.hasBall&&!c.isDown)tm=nearestMateInAimDir(c,currentAimDir());
  passM.visible=!!tm;
  if(tm)passM.position.set(tm.mesh.position.x,.09,tm.mesh.position.z);
  
  const k=Math.max(1,1.7/cam.aspect);
  let fx=0,fz=0,hgt,dst,fovT=44;
  if(camLevel===5){
    hgt=Math.max(84,129/cam.aspect);dst=.5;
  }else{
    hgt=CAMS[camLevel][0]*k;dst=CAMS[camLevel][1]*k;
    fx=clamp(bx,-40,40);fz=bz*.3;
  }
  tp.set(fx,hgt,fz+dst);
  tl.set(fx,0,fz);
  camPos.lerp(tp,1-Math.pow(1-.06,fs));
  camLook.lerp(tl,1-Math.pow(1-.12,fs));
  cam.position.copy(camPos);
  cam.lookAt(camLook);
  if(Math.abs(cam.fov-fovT)>.05){cam.fov+=(fovT-cam.fov)*.05*fs;cam.updateProjectionMatrix()}
  
  const rx=clamp(ball.x,M+60,W-M-60),rd=rx-ref.x;
  ref.vx=Math.abs(rd)<35?0:clamp(rd*.03,-2,2);
  ref.vy=0;
  ref.x+=ref.vx*fs;ref.walk+=Math.abs(ref.vx)*.1*fs;ref.sync();
  R.render(scene,cam);
}

/* ================== الحلقة الرئيسية ================== */
let acc=0;
const STEP=1/60;

function step(dt){
  if(freezeTimer>0){
    freezeTimer-=dt;
    if(freezeTimer<=0){freezeTimer=0;freezeReason=''}
    return;
  }
  if(state==='countdown'){
    cdT+=dt;
    if(cdT>=1){
      cdT=0;cdV--;
      if(cdV>0)sfx.count();else sfx.go();
      if(cdV<0)state='playing';
    }
  }else if(state==='playing'){
    matchTime-=dt;
    restartT=Math.max(0,restartT-dt);
    if(matchTime<=0){
      matchTime=0;sfx.whistle();
      state=half===1?'halftime':'ended';
      phaseT=3;
      if(state==='ended')reportMatch();
    }
    autoSwitch(dt);
    applyInputs();
    aiUpdate(dt);
    all().forEach(p=>p.update(dt));
    const sc=ball.update(dt);
    if(sc&&state==='playing'){
      if(typeof sc==='object')handleOut(sc);
      else{
        lastScorer=sc==='left'?'red':'green';
        kickTeam=lastScorer==='red'?'green':'red';
        lastScorer==='red'?scoreRed++:scoreGreen++;
        goalP=ball.lastTouch&&ball.lastTouch.team===lastScorer&&!ball.lastTouch.isGK?ball.lastTouch:null;
        if(goalP)goalP.celeb=2;
        sfx.goal();state='goal';phaseT=2.4;
      }
    }
    if(state==='playing'){
      handleBallControl();
      resolveCollisions();
      checkSlides();
    }
  }else if(state==='goal'||state==='halftime'||state==='foul'){
    phaseT-=dt;
    if(state==='goal')all().forEach(p=>p.celeb=Math.max(0,p.celeb-dt));
    if(phaseT<=0){
      if(state==='goal'){resetPositions();state='playing'}
      else if(state==='foul'){
        setPiece(foulInfo);state='playing';
        if(foulInfo.kind==='foul')startFreeze('استئناف اللعب');
      }
      else{half=2;matchTime=HALF;kickTeam='green';cdV=3;cdT=0;resetPositions();state='countdown'}
    }
  }
}

function gameLoop(ts){
  const fdt=Math.min(.1,(ts-last)/1000||0);
  last=ts;
  const sc=slowT>0?.3:1;
  slowT=Math.max(0,slowT-fdt);
  acc+=fdt*sc;
  let n=0;
  while(acc>=STEP&&n<5){step(STEP);acc-=STEP;n++}
  if(n>=5)acc=0;
  render3d(ts,fdt*60*sc);
  updateHUD();
  requestAnimationFrame(gameLoop);
}

/* ================== الحساب ================== */
const API_URL='https://script.google.com/macros/s/AKfycbz1QdPZPqww6j9Fi-Y40Y1dJNeZNNlKps0LqGlUAZOJsHQMSoo8zLkAIv9O4WTbxbl2/exec';
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(_){return null}};
const esc=x=>String(x).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const newToken=()=>[...crypto.getRandomValues(new Uint8Array(32))].map(b=>b.toString(16).padStart(2,'0')).join('');
let token=LS('fb_token'),banned=false,acct=null;
if(!/^[0-9a-f]{64}$/.test(token||'')){token=newToken();LS('fb_token',token)}
let device=LS('fb_device');
if(!device){
  device=crypto.randomUUID?crypto.randomUUID():newToken().slice(0,36);
  LS('fb_device',device);
}
try{acct=JSON.parse(LS('fb_acct')||'null')}catch(_){}
acct=acct||{
  name:'لاعب'+(1000+Math.floor(Math.random()*9000)),
  level:1,omWins:0,omTotal:0,omGoals:0,
  fMatches:0,fGoals:0,state:'نشط',email:''
};
const saveAcct=()=>LS('fb_acct',JSON.stringify(acct));
async function api(action,data={}){
  if(!API_URL)return{ok:false,error:'no_api'};
  try{
    const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({action,token,device,...data})});
    return await r.json();
  }catch(_){return{ok:false,error:'network'}}
}
const ERR={
  no_api:'الخادم غير مضبوط',network:'تعذر الاتصال',
  bad_email:'بريد غير صالح',throttled:'انتظر قليلاً',
  too_many:'محاولات كثيرة',invalid:'البريد أو الكود غير صحيح',
  banned:'هذا الحساب محظور',server:'خطأ في الخادم'
};
const say=t=>{$('accmsg').textContent=t};
const sayErr=r=>say(ERR[r.error]||'حدث خطأ');

function renderAcc(){
  const a=acct;
  $('accinfo').innerHTML=`<b>${esc(a.name)}</b> · المستوى ${a.level}<br>البريد: ${esc(a.email||'غير مربوط')}<br>${API_URL?'🟢 مرتبط بالخادم':'⚪ وضع محلي'}`;
  $('inName').value=a.name;
  $('who').textContent=banned?'⛔ الحساب محظور':`${a.name} · المستوى ${a.level}`;
}
$('bName').onclick=async()=>{
  const n=$('inName').value.trim().slice(0,20);if(!n)return;
  if(API_URL){
    const r=await api('setName',{name:n});
    if(!r.ok)return sayErr(r);
    acct=r.profile;
  }else acct.name=n;
  saveAcct();renderAcc();say('تم الحفظ ✓');
};
$('bMail').onclick=async()=>{
  const email=$('inMail').value.trim();
  if(!/^\S+@\S+\.\S{2,}$/.test(email))return say(ERR.bad_email);
  const r=await api('setEmail',{email});
  if(!r.ok)return sayErr(r);
  acct=r.profile;saveAcct();renderAcc();
  say('أُرسل كود الاسترجاع إلى بريدك ✓');
};
$('bReq').onclick=async()=>{
  const email=$('rcMail').value.trim();if(!email)return say('أدخل البريد');
  const r=await api('requestRecovery',{email});
  if(!r.ok)return sayErr(r);
  say('إن كان البريد مسجلاً فقد أُرسل إليه كود الاسترجاع');
};
$('bRec').onclick=async()=>{
  const email=$('rcMail').value.trim(),code=$('rcCode').value.trim();
  if(!email||!code)return say('أدخل البريد والكود');
  const nt=newToken();
  const r=await api('recover',{email,code,token:nt});
  if(!r.ok)return sayErr(r);
  token=nt;LS('fb_token',nt);acct=r.profile;saveAcct();renderAcc();
  say('تم استرجاع حسابك ✓');
};
function localReport(off,gf,ga){
  if(!off){acct.fMatches++;acct.fGoals+=gf;return false}
  acct.omGoals+=gf;let up=false;
  if(gf>ga){
    acct.omWins++;
    if(acct.omWins>=3){acct.level++;acct.omWins=0;up=true}
  }else if(gf<ga)acct.omWins=Math.max(0,acct.omWins-1);
  return up;
}
async function reportMatch(){
  const off=mode==='official',gf=scoreRed,ga=scoreGreen;
  let up=false,fail=false;
  if(API_URL){
    const r=await api('report',{type:off?'official':'friendly',goalsFor:gf,goalsAgainst:ga,matchId});
    if(r.ok){acct=r.profile;up=!!r.leveledUp}else fail=true;
  }else up=localReport(off,gf,ga);
  endNote=fail?'تعذر حفظ النتيجة':up?`🎉 صعدت إلى المستوى ${acct.level}!`:off?`تقدّمك: ${acct.omWins}/3`:'';
  saveAcct();renderAcc();
}
async function initAccount(){
  renderAcc();if(!API_URL)return;
  const r=await api('register',{name:acct.name});
  if(r.ok){acct=r.profile;saveAcct()}else if(r.error==='banned')banned=true;
  renderAcc();
  setInterval(()=>api('ping'),60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)api('ping')});
  addEventListener('pagehide',()=>{
    try{navigator.sendBeacon(API_URL,JSON.stringify({action:'offline',token}))}catch(_){}
  });
}

/* ================== الفريق ================== */
function saveTeam(){
  LS('fb_team',JSON.stringify({
    f:redForm,
    s:redTeam.slice(1).map(p=>p.number),
    b:redBench.map(p=>p.number)
  }));
}
function loadTeam(){
  try{
    const t=JSON.parse(LS('fb_team')||'null');
    if(!t||!FORMS[t.f])return;
    const pool=[...redTeam,...redBench],by=n=>pool.find(p=>p.number===n);
    const s=t.s.map(by),b=t.b.map(by);
    if(s.length!==4||b.length!==3||[...s,...b].some(x=>!x||x.isGK)||new Set([...s,...b]).size!==7)return;
    redForm=t.f;
    redTeam.splice(1,4,...s);
    redBench.splice(0,3,...b);
    redTeam.forEach(p=>p.mesh.visible=true);
    redBench.forEach(p=>p.mesh.visible=false);
    applyFormation(redTeam,redForm);
  }catch(_){}
}
function afterTeamChange(prev){
  const k=redTeam.indexOf(prev);
  if(k>=0)selectedRed=k;
  applyFormation(redTeam,redForm);
  saveTeam();
}
function swapStarters(i,j){
  const c=getControlled();
  [redTeam[i],redTeam[j]]=[redTeam[j],redTeam[i]];
  afterTeamChange(c);
}
function subst(i,b){
  const out=redTeam[i],inn=redBench[b],c=getControlled();
  Object.assign(inn,{
    x:out.x,y:out.y,vx:out.vx,vy:out.vy,
    stamina:100,isDown:false,sliding:0,diveT:0,
    bicycleT:0,kickT:0,hasBall:out.hasBall
  });
  inn.setInput(0,0);
  inn.mesh.visible=true;out.mesh.visible=false;
  out.isSprinting=false;
  if(ball.lastTouch===out)ball.lastTouch=inn;
  if(ball.target===out)ball.target=inn;
  out.hasBall=false;
  redTeam[i]=inn;redBench[b]=out;
  afterTeamChange(c===out?inn:c);
}

let tsel=null,prevState='menu';
function openModal(id){
  if(state!=='modal')prevState=state;
  state='modal';$(id).style.display='flex';
}
function closeModal(id){
  $(id).style.display='none';
  if(document.activeElement)document.activeElement.blur();
  state=prevState;
}
function renderTeam(){
  $('forms').innerHTML=Object.keys(FORMS).map(f=>
    `<button class="chip ${f===redForm?'sel':''}" data-f="${f}">${f}</button>`
  ).join('');
  const top={GK:88,DEF:68,MID:46,FWD:22};
  $('mp').innerHTML=redTeam.map((p,i)=>
    `<button class="pd ${p.isGK?'gk':''} ${tsel&&tsel.g==='s'&&tsel.i===i?'sel':''}" data-g="s" data-i="${i}" style="top:${top[p.isGK?'GK':p.role]}%;left:${50+(p.homeY-H/2)*.29}%">${p.code}</button>`
  ).join('');
  $('bench').innerHTML=redBench.map((p,i)=>
    `<button class="chip ${tsel&&tsel.g==='b'&&tsel.i===i?'sel':''}" data-g="b" data-i="${i}">SUB${i+1}</button>`
  ).join('');
}
$('team').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.f){
    redForm=b.dataset.f;
    applyFormation(redTeam,redForm);saveTeam();renderTeam();
    return;
  }
  if(b.dataset.g===undefined)return;
  const g=b.dataset.g,i=+b.dataset.i;
  if(g==='s'&&i===0)return;
  if(!tsel)tsel={g,i};
  else{
    const a=tsel;tsel=null;
    if(!(a.g===g&&a.i===i)){
      if(a.g==='s'&&g==='s')swapStarters(a.i,i);
      else if(a.g==='b'&&g==='b'){
        [redBench[a.i],redBench[i]]=[redBench[i],redBench[a.i]];saveTeam();
      }else subst(a.g==='s'?a.i:i,a.g==='b'?a.i:i);
    }
  }
  renderTeam();
});
const openTeam=()=>{
  if(state==='modal')return;
  tsel=null;renderTeam();openModal('team');
};
$('bteam').onclick=openTeam;
$('mteam').onclick=openTeam;
$('tclose').onclick=()=>closeModal('team');

const showPanel=id=>{
  for(const p of ['pReg','pRec']){
    const el=$(p);
    el.style.display=(p===id&&el.style.display!=='flex')?'flex':'none';
  }
};
$('tReg').onclick=()=>showPanel('pReg');
$('tRec').onclick=()=>showPanel('pRec');
$('macc').onclick=()=>{
  if(state==='modal')return;
  renderAcc();say('');showPanel(null);openModal('acc');
};

function renderStats(){
  const a=acct;
  const box=(t,m,g)=>`<div class="st"><h3>${t}</h3><div><b>${m}</b><span>مباراة</span></div><div><b>${g}</b><span>هدف</span></div></div>`;
  $('statbody').innerHTML=
    box('المباريات الودية',a.fMatches,a.fGoals)+
    box('المباريات الرسمية',a.omWins,a.omGoals)+
    `<div class="hint">المستوى ${a.level} · الصعود بعد 3 انتصارات (${a.omWins}/3)</div>`;
}
const openStats=async()=>{
  if(state==='modal')return;
  renderStats();openModal('stats');
  const r=await api('ping');
  if(r.ok){acct=r.profile;saveAcct();renderStats()}
};
$('bstat').onclick=openStats;
$('mstat').onclick=openStats;
$('sclose').onclick=()=>closeModal('stats');
$('aclose').onclick=()=>closeModal('acc');

$('mcpu').onclick=()=>startMatch('friendly');
$('monl').onclick=async()=>{
  if(banned)return;
  if(!API_URL){
    renderAcc();openModal('acc');
    say('المباراة الرسمية تحتاج ضبط الخادم أولاً');return;
  }
  const bt=$('monl');
  bt.disabled=true;bt.textContent='🔎 جارٍ البحث…';
  const r=await api('match');
  bt.disabled=false;bt.textContent='🌐 مباراة رسمية أونلاين';
  const note=t=>{$('who').textContent=t;setTimeout(renderAcc,3500)};
  if(!r.ok)return note(ERR[r.error]||'حدث خطأ');
  if(!r.found)return note('لا يوجد لاعب مسجّل نشط الآن');
  startMatch('official',{name:r.name,level:r.level});
};

/* ================== اختيار مستوى الكاميرا ================== */
let camLevel=clamp(+LS('fb_cam')||2,1,5);
function renderCam(){
  document.querySelectorAll('#camrow .chip,#camdd .chip').forEach(b=>{
    b.classList.toggle('sel',+b.dataset.c===camLevel);
  });
}
const pickCam=e=>{
  const b=e.target.closest('.chip');
  if(!b)return false;
  camLevel=+b.dataset.c;
  LS('fb_cam',camLevel);
  renderCam();
  return true;
};
$('camrow').onclick=pickCam;
$('camdd').onclick=e=>{if(pickCam(e))$('camdd').style.display='none'};
$('bcam').onclick=()=>{
  const dd=$('camdd');
  dd.style.display=dd.style.display==='flex'?'none':'flex';
};

/* ================== بدء ================== */
renderCam();
loadTeam();
initAccount();
resetPositions();
camPos.set(0,40,55);
requestAnimationFrame(gameLoop);
